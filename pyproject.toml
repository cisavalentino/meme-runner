[project]
name = "runner-research"
version = "0.1.0"
description = "Solana launchpad graduation research pipeline"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dune = ["dune-client>=1.7"]
analysis = ["duckdb", "pandas", "scikit-learn", "lightgbm"]
dev = ["pytest>=8"]

[project.scripts]
rr = "runner_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runner_research = ["sql/*.sql", "web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
